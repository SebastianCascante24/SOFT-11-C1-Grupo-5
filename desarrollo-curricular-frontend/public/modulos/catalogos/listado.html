<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de catálogo | Desarrollo Curricular y Docente</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>
    <main id="contenido">
        <h1 id="listado-catalogo-titulo">Listado de catálogo</h1>

        <section id="listado-catalogo-contenido" class="card" aria-labelledby="listado-catalogo-titulo">
            <div class="card-body">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <p id="listado-catalogo-contador" class="mb-0" role="status"></p>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-secondary" id="listado-catalogo-limpiar-filtros">Limpiar
                            filtros</button>
                        <!-- Exportar csv: solo visual por ahora, sin funcionalidad -->
                        <button type="button" class="btn btn-secondary" id="listado-catalogo-exportar-csv">Exportar
                            csv</button>
                        <a id="listado-catalogo-agregar" class="btn btn-primary" href="formulario.html">Agregar
                            registro</a>
                    </div>
                </div>

                <div id="listado-catalogo-filtros-activos" class="mb-3" hidden>
                    <span class="fw-semibold">Filtros activos:</span>
                    <ul id="listado-catalogo-lista-filtros" class="list-unstyled d-flex flex-wrap gap-2 mb-0 mt-1"></ul>
                </div>

                <!-- Los filtros viven en el encabezado de la tabla: cada columna tiene su propio campo -->
                <form id="listado-catalogo-formulario" aria-label="Filtros del listado" novalidate>
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle"
                            aria-labelledby="listado-catalogo-titulo">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">
                                        <label class="form-label mb-1"
                                            for="listado-catalogo-filtro-codigo">Código</label>
                                        <input type="text" class="form-control form-control-sm"
                                            id="listado-catalogo-filtro-codigo" name="codigo" autocomplete="off">
                                    </th>
                                    <th scope="col">
                                        <label class="form-label mb-1"
                                            for="listado-catalogo-filtro-nombre">Nombre</label>
                                        <input type="text" class="form-control form-control-sm"
                                            id="listado-catalogo-filtro-nombre" name="nombre" autocomplete="off">
                                    </th>
                                    <th scope="col">
                                        <label class="form-label mb-1"
                                            for="listado-catalogo-filtro-estado">Estado</label>
                                        <select class="form-select form-select-sm" id="listado-catalogo-filtro-estado"
                                            name="estado">
                                            <option value="todos">Todos</option>
                                            <option value="activo">Activo</option>
                                            <option value="inactivo">Inactivo</option>
                                        </select>
                                    </th>
                                    <th scope="col" class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="listado-catalogo-cuerpo"></tbody>
                        </table>
                    </div>
                </form>

                <p id="listado-catalogo-vacio" class="alert alert-info" role="status" hidden></p>

                <nav class="d-flex justify-content-center align-items-center gap-3 mt-3"
                    aria-label="Paginación del listado">
                    <button type="button" class="btn btn-secondary" id="listado-catalogo-anterior">Anterior</button>
                    <span id="listado-catalogo-pagina" aria-live="polite"></span>
                    <button type="button" class="btn btn-secondary" id="listado-catalogo-siguiente">Siguiente</button>
                </nav>
            </div>
        </section>
    </main>
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/componentes/layout.js"></script>
    <script src="../../js/nucleo/almacenamiento.js"></script>
    <script src="../../js/nucleo/api.js"></script>
    <script src="../../js/nucleo/enrutador.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
    <script src="../../js/utilidades/formateadores.js"></script>
    <script src="../../js/componentes/notificacion.js"></script>
    <script src="../../js/componentes/modal.js"></script>
    <script src="catalogos.js"></script>
</body>

</html>
