<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos | Desarrollo Curricular y Docente</title>
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>
    <main id="contenido">
        <h1 id="cursos-titulo">Cursos</h1>
        <p class="text-secondary">Consulta y administra los cursos registrados.</p>

        <section class="card" aria-labelledby="cursos-titulo">
            <div class="card-body">
                <div class="mb-3 col-12 col-md-6 col-lg-4">
                    <label class="form-label" for="filtro-carrera">Consultar cursos por carrera</label>
                    <select class="form-select" id="filtro-carrera">
                        <option value="">Todas las carreras</option>
                    </select>
                </div>

                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <p id="contador" class="mb-0" role="status" aria-live="polite">0 registros</p>

                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-secondary" id="limpiar-filtros">Limpiar filtros</button>
                        <a href="registro.html" class="btn btn-primary">Agregar registro</a>
                    </div>
                </div>

                <!-- Los filtros viven en el encabezado de la tabla: cada columna tiene su propio campo -->
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle" aria-labelledby="cursos-titulo">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">
                                    <label class="form-label mb-1" for="filtro-codigo">Código</label>
                                    <input id="filtro-codigo" type="search" class="form-control form-control-sm"
                                        autocomplete="off">
                                </th>
                                <th scope="col">
                                    <label class="form-label mb-1" for="filtro-nombre">Nombre del curso</label>
                                    <input id="filtro-nombre" type="search" class="form-control form-control-sm"
                                        autocomplete="off">
                                </th>
                                <th scope="col">
                                    <label class="form-label mb-1" for="filtro-modalidad">Modalidad</label>
                                    <select id="filtro-modalidad" class="form-select form-select-sm">
                                        <option value="">Todas</option>
                                        <option value="Presencial">Presencial</option>
                                        <option value="Virtual">Virtual</option>
                                        <option value="Híbrida">Híbrida</option>
                                    </select>
                                </th>
                                <th scope="col">
                                    <label class="form-label mb-1" for="filtro-estado">Estado</label>
                                    <select id="filtro-estado" class="form-select form-select-sm">
                                        <option value="">Todos</option>
                                        <option value="Borrador">Borrador</option>
                                        <option value="En revisión">En revisión</option>
                                        <option value="Aprobado">Aprobado</option>
                                        <option value="Rechazado">Rechazado</option>
                                    </select>
                                </th>
                                <th scope="col" class="text-center">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-cursos">
                            <tr>
                                <td colspan="5">Cargando cursos...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <p id="mensaje-listado" role="status" aria-live="polite" class="mb-0"></p>
            </div>
        </section>
    </main>

    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/componentes/layout.js"></script>
    <script src="listado.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
</body>

</html>
