
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escuelas registradas | Desarrollo Curricular y Docente</title>

    <!-- Bootstrap y estilos institucionales -->
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

    <main id="contenido">

        <h1>Escuelas registradas</h1>

        <p class="text-secondary mb-4">
            Consulte las escuelas registradas en el Sistema
            de Gestión Curricular y Docente.
        </p>

        <!-- Acción de registro -->
        <div class="d-flex flex-wrap gap-2 mb-4">

            <a href="formulario.html"
               class="btn btn-primary">
                Registrar nueva escuela
            </a>

        </div>

        <!-- Listado de escuelas -->
        <section class="card mb-4"
                 aria-labelledby="tituloListadoEscuelas">

            <div class="card-body">

                <h2 id="tituloListadoEscuelas"
                    class="h5 mb-4">
                    Listado de escuelas registradas
                </h2>

                <!-- Buscador -->
                <div class="mb-3">

                    <label for="buscarEscuela"
                           class="form-label">
                        Buscar escuela
                    </label>

                    <input type="search"
                           class="form-control"
                           id="buscarEscuela"
                           placeholder="Buscar por código, nombre o director"
                           autocomplete="off">

                </div>

                <!-- Mensajes del sistema -->
                <div id="mensajeBusquedaEscuela"
                     class="alert alert-info"
                     role="status"
                     aria-live="polite"
                     hidden>
                </div>

                <!-- Contador de escuelas -->
                <p id="totalEscuelas"
                   class="text-secondary mb-3"
                   role="status"
                   aria-live="polite">
                    Total de escuelas registradas: 0
                </p>

                <!-- Tabla de escuelas -->
                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <thead class="table-primary">

                            <tr>
                                <th scope="col">Código</th>

                                <th scope="col">
                                    Nombre de escuela
                                </th>

                                <th scope="col">Director</th>

                                <th scope="col">Acciones</th>
                            </tr>

                        </thead>

                        <tbody id="tablaEscuelas">
                        </tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <!-- Dependencias compartidas -->
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/componentes/layout.js"></script>
    <script src="../../js/nucleo/almacenamiento.js"></script>
    <script src="../../js/nucleo/enrutador.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
    <script src="../../js/utilidades/validadores.js"></script>
    <script src="../../js/componentes/notificacion.js"></script>

    <!-- Lógica del listado de escuelas -->
    <script src="listado.js"></script>

</body>

</html>
