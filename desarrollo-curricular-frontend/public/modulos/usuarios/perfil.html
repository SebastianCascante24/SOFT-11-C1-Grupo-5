
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consultar perfil de usuario | Desarrollo Curricular y Docente</title>

    <!-- Bootstrap y estilos institucionales -->
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

    <main id="contenido">

        <h1 id="titulo-pagina-perfil">
            Consultar perfil de usuario
        </h1>

        <p id="descripcion-perfil" class="text-secondary mb-4">
            Consulte la información del perfil de usuario.
        </p>

        <!-- Información del perfil -->
        <section class="card mb-4" aria-labelledby="titulo-perfil">

            <div class="card-body">

                <h2 id="titulo-perfil" class="h5 mb-4">
                    Información del perfil
                </h2>

                <div id="perfil-datos" role="status"></div>

                <div class="d-flex flex-wrap gap-2 mt-4">

                    <button type="button"
                            class="btn btn-primary"
                            id="boton-editar-perfil"
                            hidden>
                        Editar mi perfil
                    </button>

                    <a class="btn btn-secondary"
                       href="listado.html"
                       id="volver-usuarios">
                        Volver a usuarios
                    </a>

                </div>

                <!-- Formulario de edición personal -->
                <form id="form-editar-perfil"
                      class="mt-4"
                      novalidate
                      hidden>

                    <hr class="my-4">

                    <h2 class="h5 mb-3">
                        Modificar mis datos personales
                    </h2>

                    <p class="text-secondary">
                        Los campos con
                        <span class="text-danger">*</span>
                        son obligatorios.
                    </p>

                    <div id="mensaje-editar-perfil"
                         class="alert alert-danger"
                         role="status"
                         aria-live="polite"
                         hidden>
                    </div>

                    <div class="row g-3">

                        <!-- Nombre completo -->
                        <div class="col-12 col-md-6">

                            <label for="perfil-nombre"
                                   class="form-label">
                                Nombre completo
                                <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   class="form-control"
                                   id="perfil-nombre"
                                   maxlength="80"
                                   autocomplete="name"
                                   aria-describedby="error-perfil-nombre"
                                   required>

                            <div id="error-perfil-nombre"
                                 class="invalid-feedback">
                            </div>

                        </div>

                        <!-- Número telefónico -->
                        <div class="col-12 col-md-6">

                            <label for="perfil-telefono"
                                   class="form-label">
                                Número telefónico
                                <span class="text-danger">*</span>
                            </label>

                            <input type="tel"
                                   class="form-control"
                                   id="perfil-telefono"
                                   maxlength="20"
                                   placeholder="Ejemplo: 8888-8888"
                                   autocomplete="tel"
                                   aria-describedby="error-perfil-telefono"
                                   required>

                            <div id="error-perfil-telefono"
                                 class="invalid-feedback">
                            </div>

                        </div>

                        <!-- Correo personal -->
                        <div class="col-12 col-md-6">

                            <label for="perfil-correo-personal"
                                   class="form-label">
                                Correo personal
                            </label>

                            <input type="email"
                                   class="form-control"
                                   id="perfil-correo-personal"
                                   maxlength="80"
                                   autocomplete="email"
                                   placeholder="ejemplo@gmail.com"
                                   aria-describedby="error-perfil-correo-personal">

                            <div id="error-perfil-correo-personal"
                                 class="invalid-feedback">
                            </div>

                        </div>

                        <!-- Fecha de nacimiento -->
                        <div class="col-12 col-md-6">

                            <label for="perfil-nacimiento"
                                   class="form-label">
                                Fecha de nacimiento
                                <span class="text-danger">*</span>
                            </label>

                            <input type="date"
                                   class="form-control"
                                   id="perfil-nacimiento"
                                   autocomplete="bday"
                                   aria-describedby="error-perfil-nacimiento"
                                   required>

                            <div id="error-perfil-nacimiento"
                                 class="invalid-feedback">
                            </div>

                        </div>

                        <!-- Género -->
                        <div class="col-12 col-md-6">

                            <label for="perfil-genero"
                                   class="form-label">
                                Género
                                <span class="text-danger">*</span>
                            </label>

                            <select id="perfil-genero"
                                    class="form-select"
                                    aria-describedby="error-perfil-genero"
                                    required>

                                <option value="">
                                    Seleccione una opción
                                </option>

                                <option value="f">Femenino</option>
                                <option value="m">Masculino</option>
                                <option value="o">Otro</option>
                                <option value="n">Prefiero no indicarlo</option>

                            </select>

                            <div id="error-perfil-genero"
                                 class="invalid-feedback">
                            </div>

                        </div>

                    </div>

                    <!-- Acciones del formulario -->
                    <div class="d-flex flex-wrap justify-content-end gap-2 mt-4">

                        <button type="button"
                                class="btn btn-secondary"
                                id="cancelar-edicion-perfil">
                            Cancelar
                        </button>

                        <button type="submit"
                                class="btn btn-primary">
                            Guardar cambios
                        </button>

                    </div>

                </form>

            </div>

        </section>

        <!-- Personalización exclusiva del perfil propio -->
        <section id="seccion-avatar"
                 class="card"
                 aria-labelledby="titulo-avatar"
                 hidden>

            <div class="card-body">

                <h2 id="titulo-avatar" class="h5 mb-3">
                    Personalizar imagen
                </h2>

                <p class="text-secondary">
                    Elegí una imagen para tu perfil.
                </p>

                <div id="avatares"
                     class="d-flex flex-wrap gap-2 mb-3"
                     role="group"
                     aria-label="Elegir avatar">
                </div>

                <div id="mensaje-avatar"
                     class="alert alert-info"
                     role="status"
                     aria-live="polite"
                     hidden>
                </div>

            </div>

        </section>

    </main>

    <!-- Dependencias compartidas -->
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/componentes/layout.js"></script>
    <script src="../../js/nucleo/almacenamiento.js"></script>
    <script src="../../js/nucleo/enrutador.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
    <script src="../../js/utilidades/validadores.js"></script>
    <script src="../../js/componentes/notificacion.js"></script>

    <!-- Lógica del perfil -->
    <script src="perfil.js"></script>

</body>

</html>
