<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="icon" type="image/png" href="../../favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisión de cursos | Desarrollo Curricular y Docente</title>
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/base/reset.css">
    <link rel="stylesheet" href="../../css/base/tipografia.css">
    <link rel="stylesheet" href="../../css/layout/encabezado.css">
    <link rel="stylesheet" href="../../css/layout/menu-lateral.css">
    <link rel="stylesheet" href="../../css/layout/grid.css">
    <link rel="stylesheet" href="../../css/componentes/formularios.css">
    <link rel="stylesheet" href="../../css/componentes/botones.css">
    <link rel="stylesheet" href="../../css/componentes/tablas.css">
    <link rel="stylesheet" href="../../css/componentes/tarjetas.css">
    <link rel="stylesheet" href="../../css/componentes/alertas.css">
</head>

<body>
    <a class="salto-contenido" href="#contenido">Saltar al contenido</a>

    <header class="encabezado">
        <!-- contenedor para la imagen de la U, pendiente -->
        <a class="logo" href="../../index.html" aria-label="Desarrollo Curricular y Docente, ir al inicio"></a>

        <div class="encabezado-acciones" role="group" aria-label="Opciones de la cuenta">
            <button type="button" class="boton-secundario" id="encabezado-notificaciones" title="Notificaciones"
                aria-label="Notificaciones"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.268 21a2 2 0 0 0 3.464 0" />
                    <path
                        d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326" />
                </svg></button>
            <select id="encabezado-idioma" aria-label="Idioma">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
            <!-- A de admin por ahora -->
            <button type="button" class="avatar" id="encabezado-avatar" aria-label="Perfil">A</button>
            <button type="button" class="boton-secundario" id="encabezado-cerrar-sesion" aria-label="Cerrar sesión"
                title="Cerrar sesión"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" aria-hidden="true" focusable="false" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="m16 17 5-5-5-5" />
                    <path d="M21 12H9" />
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                </svg></button>
        </div>
    </header>

    <div class="contenedor-principal">
        <nav class="menu-lateral" aria-label="Menú principal">
            <ul>
                <li><a href="../../index.html">Inicio</a></li>
                <li><a href="../usuarios/listado.html">Usuarios</a></li>
                <li><a href="../escuelas/listado.html">Escuelas</a></li>
                <li><a href="../carreras/listado.html">Carreras</a></li>
                <li><a href="../cursos/listado.html">Cursos</a></li>
                <li><a href="pendientes.html" aria-current="page">Revisión de cursos</a></li>
                <li><a href="../catalogos/listado.html?catalogo=areas-sfia">Áreas SFIA</a></li>
                <li><a href="../catalogos/listado.html?catalogo=tematicas">Temática</a></li>
                <li><a href="../catalogos/listado.html?catalogo=metodologias">Metodologías de aprendizaje</a></li>
                <li><a href="../catalogos/listado.html?catalogo=casas-certificadoras">Casas certificadoras</a></li>
                <li><a href="../catalogos/listado.html?catalogo=niveles-complejidad">Niveles de complejidad</a></li>
            </ul>
        </nav>

        <main id="contenido">
            <h1 id="revision-titulo">Cursos pendientes de revisión</h1>

            <section id="revision-contenido" class="tarjeta" aria-labelledby="revision-titulo">
                <div class="barra-herramientas">
                    <p id="revision-contador" role="status"></p>
                </div>

                <table aria-labelledby="revision-titulo">
                    <thead>
                        <tr>
                            <th scope="col">Código</th>
                            <th scope="col">Nombre</th>
                            <th scope="col">Escuela</th>
                            <th scope="col" class="columna-acciones">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="revision-cuerpo"></tbody>
                </table>

                <p id="revision-vacio" role="status" hidden></p>

                <nav class="paginacion" aria-label="Paginación del listado">
                    <button type="button" class="boton-secundario" id="revision-anterior">Anterior</button>
                    <span id="revision-pagina" aria-live="polite"></span>
                    <button type="button" class="boton-secundario" id="revision-siguiente">Siguiente</button>
                </nav>
            </section>
        </main>
    </div>

    <script src="../../js/nucleo/almacenamiento.js"></script>
    <script src="../../js/nucleo/enrutador.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
    <script src="../../js/utilidades/validadores.js"></script>
    <script src="../../js/componentes/notificacion.js"></script>
    <script src="revision.js"></script>
</body>

</html>
