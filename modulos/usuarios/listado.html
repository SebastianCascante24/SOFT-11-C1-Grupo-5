
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usuarios registrados | Desarrollo Curricular y Docente</title>

    <!-- Estilos institucionales y Bootstrap -->
    <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../css/base/variables.css">
    <link rel="stylesheet" href="../../css/estilos.css">
</head>

<body>

    <main id="contenido">

        <h1>Usuarios registrados</h1>

        <p class="text-muted mb-4">
            Consulte los usuarios registrados en el Sistema
            de Gestión Curricular y Docente.
        </p>

        <!-- Acciones principales -->
        <div class="d-flex flex-wrap gap-2 mb-4">

            <a href="usuario-registro.html"
               class="btn btn-primary">
                Registrar nuevo usuario
            </a>

        </div>

        <!-- Listado de usuarios -->
        <section class="card" aria-labelledby="titulo-listado">

            <div class="card-body">

                <h2 id="titulo-listado" class="h5 mb-3">
                    Listado de usuarios
                </h2>

                <!-- Buscador -->
                <div class="mb-3">

                    <label for="buscar-usuario" class="form-label">
                        Buscar usuario
                    </label>

                    <input
                        type="search"
                        class="form-control"
                        id="buscar-usuario"
                        placeholder="Buscar por nombre o correo institucional"
                        autocomplete="off">

                </div>

                <!-- Mensajes del listado -->
                <p id="mensaje"
                   class="text-muted small mb-3"
                   role="status"
                   aria-live="polite">

                    Cargando usuarios...

                </p>

                <!-- Tabla adaptable -->
                <div class="table-responsive">

                    <table class="table table-hover align-middle mb-0">

                        <caption class="visually-hidden">
                            Listado de usuarios registrados
                        </caption>

                        <thead class="table-primary">
                            <tr>
                                <th scope="col">Nombre completo</th>
                                <th scope="col">Correo institucional</th>
                                <th scope="col">Género</th>
                                <th scope="col">Rol</th>
                                <th scope="col">Fecha de registro</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tabla-usuarios"></tbody>

                    </table>

                </div>

            </div>

        </section>

    </main>

    <!-- Dependencias compartidas -->
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/componentes/layout.js"></script>
    <script src="../../js/nucleo/almacenamiento.js"></script>
    <script src="../../js/nucleo/enrutador.js"></script>
    <script src="../../js/nucleo/autenticacion.js"></script>
    <script src="../../js/utilidades/validadores.js"></script>
    <script src="../../js/componentes/notificacion.js"></script>
    <script src="usuarios.js"></script>

    <!-- Lógica del listado -->
    <script>

        document.addEventListener("DOMContentLoaded", () => {

            const tabla = document.getElementById("tabla-usuarios");
            const mensaje = document.getElementById("mensaje");
            const buscador = document.getElementById("buscar-usuario");

            let usuarios = [];

            // Obtener usuarios almacenados
            try {

                const datos = JSON.parse(
                    localStorage.getItem("grupo5_usuarios") || "[]"
                );

                usuarios = Array.isArray(datos) ? datos : [];

            } catch (error) {

                console.error("Error al consultar usuarios:", error);

                mensaje.className = "alert alert-danger";

                mensaje.textContent =
                    "No fue posible leer los usuarios almacenados.";

                mensaje.setAttribute("role", "alert");

                return;
            }

            // Mostrar mensaje cuando no existen usuarios
            if (usuarios.length === 0) {

                mensaje.className = "alert alert-info";

                mensaje.textContent =
                    "No existen usuarios registrados.";

                return;
            }

            mensaje.textContent =
                `Total de usuarios registrados: ${usuarios.length}`;

            // Etiquetas de género
            const generos = {
                f: "Femenino",
                m: "Masculino",
                o: "Otro",
                n: "Prefiero no indicarlo"
            };

            // Etiquetas de roles
            const roles = {
                admin: "Administrador",
                rectoria: "Rectoría",
                vice: "Vicerrectoría",
                dc: "Desarrollo Curricular",
                dir: "Dirección de Escuela / Carrera"
            };

            // Construcción de la tabla
            usuarios.forEach(usuario => {

                const fila = document.createElement("tr");

                let fecha = "No disponible";

                if (usuario.fechaRegistro) {

                    const fechaConvertida =
                        new Date(usuario.fechaRegistro);

                    if (!Number.isNaN(fechaConvertida.getTime())) {

                        fecha =
                            fechaConvertida.toLocaleDateString("es-CR");
                    }
                }

                const valores = [

                    usuario.nombre || "No disponible",

                    usuario.correo || "No disponible",

                    generos[usuario.genero] ||
                        usuario.genero ||
                        "No disponible",

                    roles[usuario.rol] ||
                        usuario.rol ||
                        "No disponible",

                    fecha
                ];

                valores.forEach(valor => {

                    const celda = document.createElement("td");

                    celda.textContent = valor;

                    fila.appendChild(celda);

                });

                // Acciones del usuario
                const celdaAcciones = document.createElement("td");

                const acciones = document.createElement("div");

                acciones.className = "d-flex flex-wrap gap-2";

                // Botón editar
                const enlaceEditar = document.createElement("a");

                enlaceEditar.href =
                    "editar.html?id=" +
                    encodeURIComponent(usuario.id);

                enlaceEditar.textContent = "Editar";

                enlaceEditar.className =
                    "btn btn-outline-primary btn-sm";

                acciones.appendChild(enlaceEditar);

                // Botón perfil
                const enlacePerfil = document.createElement("a");

                enlacePerfil.href = "perfil.html";

                enlacePerfil.textContent = "Mi perfil";

                enlacePerfil.className =
                    "btn btn-outline-secondary btn-sm";

                acciones.appendChild(enlacePerfil);

                celdaAcciones.appendChild(acciones);

                fila.appendChild(celdaAcciones);

                tabla.appendChild(fila);

            });

            // Búsqueda por nombre o correo institucional
            buscador.addEventListener("input", () => {

                const texto =
                    buscador.value.trim().toLowerCase();

                let encontrados = 0;

                tabla.querySelectorAll("tr").forEach(fila => {

                    const nombre =
                        fila.cells[0].textContent.toLowerCase();

                    const correo =
                        fila.cells[1].textContent.toLowerCase();

                    const coincide =
                        nombre.includes(texto) ||
                        correo.includes(texto);

                    fila.hidden = !coincide;

                    fila.style.display =
                        coincide ? "" : "none";

                    if (coincide) encontrados++;

                });

                if (encontrados === 0) {

                    mensaje.className = "alert alert-info";

                    mensaje.textContent =
                        "No se encontraron usuarios que coincidan con la búsqueda.";

                } else {

                    mensaje.className = "text-muted small mb-3";

                    mensaje.textContent = texto

                        ? `Usuarios encontrados: ${encontrados}`

                        : `Total de usuarios registrados: ${usuarios.length}`;

                }

            });

        });

    </script>

</body>

</html>
